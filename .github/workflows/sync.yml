name: Auto-Sync Branches from Upstream

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so merging works correctly

      - name: Sync and Merge from Upstream
        run: |
          # 1. Configure the GitHub Actions Bot Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. Add the upstream repository 
          # REPLACE THIS with your actual upstream repository URL
          git remote add upstream https://github.com/OptionallyBlueStudios/scan-website.git
          git fetch upstream --prune

          # 3. Get a list of all remote branches from upstream
          branches=$(git branch -r | grep 'upstream/' | grep -v 'HEAD' | sed 's/  upstream\///')

          for branch in $branches; do
            echo "------------------------------------------------------"
            echo "Processing branch: $branch"
            
            # Check if this branch exists in our fork yet
            if ! git show-ref --verify --quiet refs/remotes/origin/$branch; then
              echo "New branch detected upstream: $branch. Creating it on fork."
              git checkout -b $branch upstream/$branch
              git push origin $branch
              continue
            fi

            # Check if upstream has new commits that our fork doesn't have
            UPSTREAM_COMMIT=$(git rev-parse upstream/$branch)
            FORK_COMMIT=$(git rev-parse origin/$branch)

            if [ "$UPSTREAM_COMMIT" != "$FORK_COMMIT" ]; then
              echo "Updates found upstream for branch: $branch. Attempting auto-merge..."
              
              # Checkout our fork's local version of the branch
              git checkout $branch
              git pull origin $branch

              # Attempt to merge upstream changes directly into it
              if git merge upstream/$branch --no-edit; then
                echo "Successfully merged updates for $branch! Pushing to fork..."
                git push origin $branch
              else
                echo "⚠️ MERGE CONFLICT DETECTED on branch $branch."
                echo "Skipping push. You will need to resolve this conflict manually."
                git merge --abort
              fi
            else
              echo "Branch $branch is already up to date."
            fi
          done
